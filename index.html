<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern responsive calculator built with HTML, CSS and JavaScript.">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="Calculator">
      <header class="calculator-header">
        <div>
          <p class="eyebrow">Everyday math</p>
          <h1>Calculator</h1>
        </div>
        <button type="button" id="mode-toggle" class="mode-toggle" aria-pressed="false">Scientific mode</button>
        <div class="theme-picker">
          <span class="theme-label">Theme</span>
          <div class="theme-options" role="group" aria-label="Choose a calculator theme">
            <button type="button" class="theme-option theme-option--sunset" data-theme="sunset" aria-label="Sunset theme" aria-pressed="true">
              <span aria-hidden="true"></span>
            </button>
            <button type="button" class="theme-option theme-option--ocean" data-theme="ocean" aria-label="Ocean theme" aria-pressed="false">
              <span aria-hidden="true"></span>
            </button>
            <button type="button" class="theme-option theme-option--forest" data-theme="forest" aria-label="Forest theme" aria-pressed="false">
              <span aria-hidden="true"></span>
            </button>
            <button type="button" class="theme-option theme-option--midnight" data-theme="midnight" aria-label="Midnight theme" aria-pressed="false">
              <span aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </header>

      <div class="display" aria-live="polite">
        <div id="expression" class="expression"></div>
        <div id="display" class="display-value">0</div>
      </div>

      <div class="keys">
        <button type="button" class="key utility" data-action="clear">AC</button>
        <button type="button" class="key utility" data-action="delete" aria-label="Delete">⌫</button>
        <button type="button" class="key utility" data-action="percent">%</button>
        <button type="button" class="key operator" data-value="/">÷</button>

        <div class="scientific-row" aria-label="Scientific functions">
          <button type="button" class="key scientific-key" data-scientific="sin(">sin</button>
          <button type="button" class="key scientific-key" data-scientific="cos(">cos</button>
          <button type="button" class="key scientific-key" data-scientific="tan(">tan</button>
          <button type="button" class="key scientific-key" data-scientific="log(">log</button>
          <button type="button" class="key scientific-key" data-scientific="ln(">ln</button>
          <button type="button" class="key scientific-key" data-scientific="sqrt(">√</button>
          <button type="button" class="key scientific-key" data-scientific="^2">x²</button>
          <button type="button" class="key scientific-key" data-scientific="^">xʸ</button>
          <button type="button" class="key scientific-key" data-scientific="PI">π</button>
          <button type="button" class="key scientific-key" data-scientific="(">(</button>
          <button type="button" class="key scientific-key" data-scientific=")">)</button>
        </div>

        <button type="button" class="key" data-value="7">7</button>
        <button type="button" class="key" data-value="8">8</button>
        <button type="button" class="key" data-value="9">9</button>
        <button type="button" class="key operator" data-value="*">×</button>

        <button type="button" class="key" data-value="4">4</button>
        <button type="button" class="key" data-value="5">5</button>
        <button type="button" class="key" data-value="6">6</button>
        <button type="button" class="key operator" data-value="-">−</button>

        <button type="button" class="key" data-value="1">1</button>
        <button type="button" class="key" data-value="2">2</button>
        <button type="button" class="key" data-value="3">3</button>
        <button type="button" class="key operator" data-value="+">+</button>

        <button type="button" class="key utility" data-action="sign">+/−</button>
        <button type="button" class="key" data-value="0">0</button>
        <button type="button" class="key" data-action="decimal">.</button>
        <button type="button" class="key equals" data-action="equals">=</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
